name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build and publish CLI releases
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  vscode-extension:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match extension version to release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --prefix vscode-extension
      - name: Test extension
        run: npm test --prefix vscode-extension
      - name: Package extension
        run: |
          mkdir -p release-assets
          npx --yes @vscode/vsce package --out ../release-assets/bitpack-tools.vsix
        working-directory: vscode-extension
      - name: Upload extension package to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" release-assets/bitpack-tools.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish extension to Visual Studio Marketplace
        if: vars.VSCODE_MARKETPLACE_PUBLISHING_ENABLED == 'true'
        run: npx --yes @vscode/vsce publish --oidc
        working-directory: vscode-extension
